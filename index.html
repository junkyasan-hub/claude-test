<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テトリス風ゲーム</title>
<style>
  :root {
    --bg: #101425;
    --panel-bg: #1b2140;
    --board-bg: #0b0e1c;
    --grid-line: #232a4d;
    --text: #f0f2ff;
    --sub: #9aa3d1;
    --accent: #6c8cff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    overscroll-behavior: contain;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: var(--text);
    padding: 16px;
  }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  #board {
    background: var(--board-bg);
    border: 4px solid var(--grid-line);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    max-width: 100%;
    max-height: 62vh;
    width: auto;
    height: auto;
    touch-action: none;
  }

  .side {
    width: 180px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .stats-row {
    display: contents;
  }

  .panel {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 16px;
  }

  .panel h2 {
    font-size: 13px;
    color: var(--sub);
    margin: 0 0 8px;
    font-weight: 500;
    letter-spacing: 0.05em;
  }

  .panel .value {
    font-size: 22px;
    font-weight: 700;
  }

  #next {
    display: block;
    margin: 0 auto;
    background: var(--board-bg);
    border-radius: 8px;
  }

  .keys {
    font-size: 12px;
    color: var(--sub);
    line-height: 1.9;
  }

  .keys b {
    color: var(--text);
  }

  #message {
    text-align: center;
    font-size: 13px;
    color: var(--accent);
    min-height: 18px;
  }

  button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  button:active {
    opacity: 0.8;
  }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .touch-controls button {
    font-size: 20px;
    padding: 0;
  }

  @media (max-width: 640px) {
    .layout {
      gap: 12px;
    }

    #board {
      max-height: 46vh;
    }

    .side {
      width: 100%;
      max-width: 340px;
    }

    .keys {
      display: none;
    }

    /* モバイルでは「操作」を上、「情報」を下に並び替える */
    .start-panel {
      order: 1;
      padding: 12px;
    }

    .touch-controls {
      order: 2;
      display: grid;
    }

    .stats-row {
      order: 3;
      display: flex;
      gap: 8px;
    }

    .next-panel {
      order: 4;
    }

    .stats-row .panel {
      flex: 1;
      padding: 10px 6px;
      text-align: center;
    }

    .stats-row h2 {
      font-size: 10px;
      margin-bottom: 2px;
    }

    .stats-row .value {
      font-size: 16px;
    }

    .touch-controls button {
      font-size: 22px;
    }
  }
</style>
</head>
<body>
  <div class="layout">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="side">
      <div class="stats-row">
        <div class="panel">
          <h2>スコア</h2>
          <div class="value" id="score">0</div>
        </div>
        <div class="panel">
          <h2>レベル</h2>
          <div class="value" id="level">1</div>
        </div>
        <div class="panel">
          <h2>消したライン</h2>
          <div class="value" id="lines">0</div>
        </div>
      </div>
      <div class="panel next-panel">
        <h2>次のブロック</h2>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="panel start-panel">
        <div id="message">スタートボタンでプレイ開始</div>
        <button id="startBtn" type="button">スタート / 再スタート</button>
      </div>
      <div class="panel keys">
        <div><b>←→</b> 移動</div>
        <div><b>↓</b> ソフトドロップ</div>
        <div><b>↑</b> 回転</div>
        <div><b>Space</b> ハードドロップ</div>
        <div><b>P</b> 一時停止</div>
      </div>
      <div class="touch-controls">
        <button id="btnRotate" type="button" aria-label="回転">⟳</button>
        <button id="btnUp" type="button" aria-label="回転">↑</button>
        <button id="btnDrop" type="button" aria-label="ハードドロップ">⬇︎</button>
        <button id="btnLeft" type="button" aria-label="左へ移動">←</button>
        <button id="btnDown" type="button" aria-label="ソフトドロップ">↓</button>
        <button id="btnRight" type="button" aria-label="右へ移動">→</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;

  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nextCtx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const linesEl = document.getElementById('lines');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');

  const COLORS = {
    I: '#4dd0e1',
    O: '#ffd54f',
    T: '#ba68c8',
    S: '#81c784',
    Z: '#e57373',
    J: '#64b5f6',
    L: '#ffb74d',
  };

  const SHAPES = {
    I: [
      [0, 1], [1, 1], [2, 1], [3, 1],
    ],
    O: [
      [1, 0], [2, 0], [1, 1], [2, 1],
    ],
    T: [
      [1, 0], [0, 1], [1, 1], [2, 1],
    ],
    S: [
      [1, 0], [2, 0], [0, 1], [1, 1],
    ],
    Z: [
      [0, 0], [1, 0], [1, 1], [2, 1],
    ],
    J: [
      [0, 0], [0, 1], [1, 1], [2, 1],
    ],
    L: [
      [2, 0], [0, 1], [1, 1], [2, 1],
    ],
  };

  const PIECE_KEYS = Object.keys(SHAPES);

  function createEmptyGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  let grid = createEmptyGrid();
  let current = null;
  let next = null;
  let score = 0;
  let level = 1;
  let linesCleared = 0;
  let dropInterval = 800;
  let dropTimer = 0;
  let lastTime = 0;
  let running = false;
  let paused = false;
  let gameOver = false;
  let rafId = null;

  function randomPieceKey() {
    return PIECE_KEYS[Math.floor(Math.random() * PIECE_KEYS.length)];
  }

  function makePiece(key) {
    const cells = SHAPES[key].map(([x, y]) => ({ x, y }));
    return { key, cells, x: 3, y: -2, color: COLORS[key] };
  }

  function rotateCells(cells) {
    // 4x4のグリッド内で時計回りに回転する
    return cells.map(({ x, y }) => ({ x: 3 - y, y: x }));
  }

  function collides(cells, offsetX, offsetY) {
    for (const c of cells) {
      const gx = c.x + offsetX;
      const gy = c.y + offsetY;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy < 0) continue;
      if (grid[gy][gx]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const c of current.cells) {
      const gx = c.x + current.x;
      const gy = c.y + current.y;
      if (gy < 0) {
        triggerGameOver();
        return;
      }
      grid[gy][gx] = current.color;
    }
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] || 800;
      score += points * level;
      linesCleared += cleared;
      level = 1 + Math.floor(linesCleared / 10);
      dropInterval = Math.max(100, 800 - (level - 1) * 70);
      updateStats();
    }
  }

  function updateStats() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    linesEl.textContent = linesCleared;
  }

  function spawnPiece() {
    current = next || makePiece(randomPieceKey());
    next = makePiece(randomPieceKey());
    if (collides(current.cells, current.x, current.y)) {
      triggerGameOver();
    }
    drawNext();
  }

  function triggerGameOver() {
    gameOver = true;
    running = false;
    messageEl.textContent = 'ゲームオーバー！ スタートボタンで再挑戦';
    if (rafId) cancelAnimationFrame(rafId);
  }

  function move(dx) {
    if (!running || paused || gameOver) return;
    if (!collides(current.cells, current.x + dx, current.y)) {
      current.x += dx;
    }
  }

  function softDrop() {
    if (!running || paused || gameOver) return;
    if (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    dropTimer = 0;
  }

  function hardDrop() {
    if (!running || paused || gameOver) return;
    let distance = 0;
    while (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      distance++;
    }
    score += distance * 2;
    updateStats();
    lockPiece();
    dropTimer = 0;
  }

  function rotate() {
    if (!running || paused || gameOver) return;
    const rotated = rotateCells(current.cells);
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(rotated, current.x + k, current.y)) {
        current.cells = rotated;
        current.x += k;
        return;
      }
    }
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    messageEl.textContent = paused ? '一時停止中（Pキーで再開）' : '';
  }

  function drawCell(context, x, y, color, size) {
    context.fillStyle = color;
    context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
    context.strokeStyle = 'rgba(255,255,255,0.15)';
    context.strokeRect(x * size + 1, y * size + 1, size - 2, size - 2);
  }

  function draw() {
    ctx.fillStyle = '#0b0e1c';
    ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

    ctx.strokeStyle = '#232a4d';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL, 0);
      ctx.lineTo(x * CELL, ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL);
      ctx.lineTo(COLS * CELL, y * CELL);
      ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) {
          drawCell(ctx, x, y, grid[y][x], CELL);
        }
      }
    }

    if (current) {
      // ゴースト（落下予測位置）を薄く表示
      let ghostY = current.y;
      while (!collides(current.cells, current.x, ghostY + 1)) ghostY++;
      ctx.globalAlpha = 0.25;
      for (const c of current.cells) {
        const gy = c.y + ghostY;
        if (gy >= 0) drawCell(ctx, c.x + current.x, gy, current.color, CELL);
      }
      ctx.globalAlpha = 1;

      for (const c of current.cells) {
        const gy = c.y + current.y;
        if (gy >= 0) drawCell(ctx, c.x + current.x, gy, current.color, CELL);
      }
    }
  }

  function drawNext() {
    nextCtx.fillStyle = '#0b0e1c';
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!next) return;
    const size = 24;
    const offsetX = (nextCanvas.width - 4 * size) / 2;
    const offsetY = (nextCanvas.height - 4 * size) / 2;
    for (const c of next.cells) {
      nextCtx.fillStyle = next.color;
      nextCtx.fillRect(offsetX + c.x * size + 1, offsetY + c.y * size + 1, size - 2, size - 2);
    }
  }

  function loop(time) {
    if (!running) return;
    const delta = time - lastTime;
    lastTime = time;
    if (!paused && !gameOver) {
      dropTimer += delta;
      if (dropTimer > dropInterval) {
        softDrop();
      }
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  function startGame() {
    grid = createEmptyGrid();
    score = 0;
    level = 1;
    linesCleared = 0;
    dropInterval = 800;
    dropTimer = 0;
    gameOver = false;
    paused = false;
    running = true;
    messageEl.textContent = '';
    updateStats();
    next = makePiece(randomPieceKey());
    spawnPiece();
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowLeft':
        e.preventDefault();
        move(-1);
        break;
      case 'ArrowRight':
        e.preventDefault();
        move(1);
        break;
      case 'ArrowDown':
        e.preventDefault();
        softDrop();
        break;
      case 'ArrowUp':
        e.preventDefault();
        rotate();
        break;
      case 'Space':
        e.preventDefault();
        if (!running || gameOver) {
          startGame();
        } else {
          hardDrop();
        }
        break;
      case 'KeyP':
        e.preventDefault();
        togglePause();
        break;
    }
  });

  // タップで即実行し、押しっぱなしで一定間隔ごとに繰り返す（スマホの移動・ソフトドロップ用）
  function bindRepeatable(el, action, repeatDelay = 250, repeatInterval = 90) {
    let timeoutId = null;
    let intervalId = null;
    const stop = () => {
      if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
      if (intervalId) { clearInterval(intervalId); intervalId = null; }
    };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      action();
      timeoutId = setTimeout(() => {
        intervalId = setInterval(action, repeatInterval);
      }, repeatDelay);
    });
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
  }

  // タップで1回だけ実行（回転・ハードドロップ・スタート用）
  function bindTap(el, action) {
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      action();
    });
  }

  bindTap(startBtn, startGame);
  bindRepeatable(document.getElementById('btnLeft'), () => move(-1));
  bindRepeatable(document.getElementById('btnRight'), () => move(1));
  bindRepeatable(document.getElementById('btnDown'), () => softDrop());
  bindTap(document.getElementById('btnUp'), () => rotate());
  bindTap(document.getElementById('btnRotate'), () => rotate());
  bindTap(document.getElementById('btnDrop'), () => hardDrop());

  draw();
  drawNext();
})();
</script>
</body>
</html>
