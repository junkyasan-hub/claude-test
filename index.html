<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自己紹介</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --accent: #4a6cf7;
    --text: #2d2d2d;
    --sub: #666666;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin: 0 auto 20px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }

  .role {
    color: var(--sub);
    margin: 0 0 24px;
    font-size: 15px;
  }

  .bio {
    line-height: 1.7;
    margin: 0 0 24px;
    text-align: left;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .tag {
    background: rgba(74, 108, 247, 0.1);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">👋</div>
    <h1>はじめまして！</h1>
    <p class="role">このリポジトリのオーナー</p>
    <p class="bio">
      このページは自己紹介用のシンプルな HTML ファイルです。
      好きな内容に書き換えて、あなた自身のプロフィールとして使ってください。
    </p>
    <div class="tags">
      <span class="tag">Web</span>
      <span class="tag">プログラミング</span>
      <span class="tag">Claude Code</span>
    </div>
  </div>
</body>
</html>
